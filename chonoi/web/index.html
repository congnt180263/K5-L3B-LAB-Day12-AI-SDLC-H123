<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Út Sen · Một ngày ở chợ nổi</title>
<style>
  :root { color-scheme: dark; --ink:#fff4dc; --gold:#ffd274; --panel:#15262c; --teal:#8be1d3; }
  html, body { margin: 0; height: 100%; background: #101e25; color: var(--ink); font: 18px/1.45 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position:fixed; inset:14px 16px auto; display:flex; justify-content:space-between; gap:14px; pointer-events:none; text-shadow:0 2px 4px #071015; }
  .hud-card { background:#10242bdc; border:1px solid #fff5; border-radius:18px; padding:11px 16px; box-shadow:0 12px 32px #07101577; max-width:min(420px,42vw); }
  .hud-card strong { color:var(--gold); font-size:20px; }
  #hud-right { text-align:right; }
  #prompt { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#10242be8; border:1px solid var(--gold); border-radius:100px; padding:8px 20px; pointer-events:none; text-align:center; }
  #screen { position:fixed; inset:0; display:grid; place-items:center; background:linear-gradient(135deg,#092e37ec,#321e25e8); backdrop-filter:blur(8px); overflow:auto; }
  #screen.hidden, #hud.hidden, #prompt.hidden { display:none; }
  .panel { width:min(760px,calc(100vw - 48px)); max-height:calc(100vh - 56px); overflow:auto; box-sizing:border-box; padding:clamp(26px,5vw,56px); border:2px solid #e3b979; border-radius:30px; background:linear-gradient(160deg,#254049,#14292f 65%,#273130); box-shadow:0 22px 80px #000a; text-align:center; animation:appear .35s ease-out; }
  .eyebrow { letter-spacing:.22em; color:var(--teal); font-weight:700; text-transform:uppercase; font-size:14px; }
  h1 { font:700 clamp(42px,7vw,84px)/1.03 Georgia,serif; color:var(--gold); margin:10px 0 22px; text-shadow:0 5px #57372c; }
  h2 { font:700 clamp(32px,5vw,52px)/1.1 Georgia,serif; color:var(--gold); margin:5px 0 18px; }
  p { margin:12px auto 24px; max-width:590px; }
  .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:20px; }
  button { cursor:pointer; font:700 18px system-ui,sans-serif; border-radius:13px; border:2px solid #e4b875; padding:12px 23px; color:#173039; background:var(--gold); transition:transform .15s,filter .15s; }
  button:hover,button:focus-visible { transform:translateY(-3px); filter:brightness(1.12); outline:3px solid #fff8; }
  button.secondary { background:#1b3d43; color:var(--ink); }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  .list { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; text-align:left; margin:18px 0; }
  .list > div { border:1px solid #ffffff44; border-radius:12px; background:#ffffff10; padding:10px 14px; }
  .warn { color:#ffb4a0 !important; animation:pulse 1s infinite alternate; }
  .contrast { --ink:#fff; --gold:#ffef00; --teal:#00ffff; }
  .contrast .hud-card,.contrast #prompt,.contrast .panel { background:#000; border-color:#fff; }
  .contrast .warn { color:#ffef00 !important; animation:none; font-weight:800; }
  @keyframes pulse { to { opacity:.55; } } @keyframes appear { from { opacity:0; transform:translateY(15px); } }
  @media(max-width:700px) { #hud { font-size:14px; } .hud-card { padding:7px 10px; } #prompt { bottom:35px; width:75vw; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div class="hud-card" id="hud-left"></div><div class="hud-card" id="hud-right"></div></div>
<div id="prompt" class="hidden"></div>
<div id="screen"></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
const screen = document.getElementById("screen");
const hud = document.getElementById("hud");
const prompt = document.getElementById("prompt");
let screenKey = "", lastPhase = "", interludeUntil = 0, interlude = "";
const DISH_NAME = { ca_loc_nuong_trui:"Cá lóc nướng trui", goi_bong_sung:"Gỏi bông súng", lau_ca_linh_dien_dien:"Lẩu cá linh điên điển", canh_chua_ca_loc:"Canh chua cá lóc", ca_keo_nuong:"Cá kèo nướng", lau_mam:"Lẩu mắm miền Tây" };
const html = (v) => String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]);
const post = async (path, body={}) => fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
function action(button) { queue.push(JSON.stringify({...currentInput(),[button]:true})); queue.push(JSON.stringify({...currentInput(),[button]:false})); flush(); }
function buy(item) { queue.push(JSON.stringify({...currentInput(),buy:item})); flush(); }
function listItems(data, names) { return Object.entries(data||{}).map(([k,v])=>`<div>${html(names[k]||k)} <strong>×${html(v)}</strong></div>`).join(""); }

function ingredientKind(item) { return typeof item === "string" ? item : item.kind; }
function counts(items, excluded = new Set()) {
  if (!Array.isArray(items)) return items || {};
  const result = {};
  for (const item of items) {
    if (!excluded.has(item.id)) {
      const kind = ingredientKind(item);
      result[kind] = (result[kind] || 0) + 1;
    }
  }
  return result;
}
function availableStock() {
  if (!Array.isArray(snap.stock)) return snap.stock || {};
  const reserved = new Set((snap.customers || []).flatMap(c => c.reserved || []));
  return counts(snap.stock.filter(item => !isSpoiled(item)), reserved);
}
function isSpoiled(item) { return item.fresh < (snap.freshness?.spoiled_below ?? 30); }
function freshnessLabel(item) {
  return typeof item === "object" && item !== null ? (isSpoiled(item) ? " (ươn)" : " " + Math.floor(item.fresh) + "%") : "";
}
function freshnessDetail(items) {
  if (!Array.isArray(items) || !items.some(item => typeof item === "object")) return "";
  return items.map(item => html(KIND_NAME[item.kind] || item.kind) + html(freshnessLabel(item))).join(" · ");
}
function toggleContrast() {
  const contrast = document.body.classList.toggle("contrast");
  localStorage.setItem("chonoi-contrast", contrast ? "1" : "0");
  screenKey = "";
  renderUI();
}
function openScreen(key, markup) { if(screenKey!==key){screenKey=key; screen.innerHTML=`<div class="panel">${markup}</div>`;} screen.classList.remove("hidden"); hud.classList.add("hidden"); prompt.classList.add("hidden"); }
function closeScreen() { screen.classList.add("hidden"); hud.classList.remove("hidden"); }
function renderUI() {
  if(!snap) return;
  const phase=snap.phase, isDay=snap.mode==="day", day=snap.day||1;
  if(!snap.active && screenKey==="intro") return;
  if(!snap.active) { openScreen("menu",`<div class="eyebrow">Một ngày ở chợ nổi</div><h1>Út Sen</h1><p>Lặn hái nguyên liệu lúc bình minh, rồi về nhà bè nấu món miền Tây cho khách.</p><div class="actions"><button id="play">Chơi 5 ngày</button><button class="secondary" id="exit">Thoát</button></div><p>WASD / phím mũi tên di chuyển · E tương tác · Space bắt cá · Esc tạm dừng</p>`); document.getElementById("play").onclick=()=>{openScreen("intro",`<div class="eyebrow">Má Tư dặn dò</div><h2>Ngày 1</h2><p>Con nhớ lấy đủ nguyên liệu cho quán tối nay nhé!</p><div class="list">${listItems(snap.day_plan?.ingredients,KIND_NAME)}</div><div class="actions"><button id="go">Bắt đầu ngay</button></div>`);const start=()=>{post("/start");closeScreen();};document.getElementById("go").onclick=start;setTimeout(()=>{if(screenKey==="intro")start();},4000);}; document.getElementById("exit").onclick=()=>{openScreen("exit",`<h2>Hẹn gặp lại!</h2><p>Bạn có thể đóng thẻ trình duyệt.</p><button id="back">Về menu</button>`);document.getElementById("back").onclick=()=>{screenKey="";renderUI();};}; return; }
  if(snap.finished && !isDay && phase==="gather" && ["docked","time","fainted"].includes(snap.reason)) {
    openScreen("gather-end",`<h2>Buổi sáng kết thúc</h2><div class="actions"><button id="open-quan">Mở quán (E)</button><button class="secondary" id="again">Chơi lại</button></div>`);
    document.getElementById("open-quan").onclick=()=>action("interact");
    document.getElementById("again").onclick=()=>post("/restart");
    return;
  }
  if(snap.finished) {const sales=Object.entries(snap.stats?.by_dish||{}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));openScreen("summary",`<div class="eyebrow">Hết mùa chợ</div><h2>Tổng kết ${html(snap.days_completed||1)} ngày</h2><div class="list"><div>Tiền còn <strong>${html(snap.money)}k</strong></div><div>Tổng thu <strong>${html(snap.earned)}k</strong></div><div>Điểm <strong>${html(snap.score)}</strong></div><div>Uy tín <strong>${Number(snap.reputation||0).toFixed(1)} ★</strong></div><div>Khách đã phục vụ <strong>${snap.stats?.served||0}</strong></div><div>Món bán chạy <strong>${html(DISH_NAME[sales[0]?.[0]]||"Chưa có")}</strong></div></div><div class="actions"><button id="again">Chơi lại</button><button class="secondary" id="home">Về menu</button></div>`); document.getElementById("again").onclick=()=>post("/start");document.getElementById("home").onclick=()=>post("/menu");return;}
  if(snap.state==="paused") {openScreen("pause",`<div class="eyebrow">Tạm dừng</div><h2>Nghỉ một chút nhé</h2><p>Đồng hồ và mọi hoạt động trong game đang dừng.</p><div class="actions"><button id="resume">Tiếp tục</button><button class="secondary" id="home">Về menu</button><button class="secondary" id="contrast">Tương phản cao: ${document.body.classList.contains("contrast")?"Bật":"Tắt"}</button></div>`);document.getElementById("resume").onclick=()=>action("pause");document.getElementById("home").onclick=()=>post("/menu");document.getElementById("contrast").onclick=toggleContrast;return;}
  if(phase==="shop") { const cards=Object.entries(snap.shop_catalog||{}).map(([item,levels])=>{const level=snap.upgrades?.[item]||0,next=levels[level];return `<div><strong>${item==="oxygen"?"Bình oxy":"Áo phao"}</strong><br>Cấp ${level}/${levels.length}<br>${next?`${next.price}k · ${item==="oxygen"?next.oxygen_max_s+" giây oxy":next.hp_max+" Máu"}`:"Đã tối đa"}<br><button data-buy="${item}" ${!next||snap.money<next.price?"disabled":""}>Mua</button></div>`}).join("");const result=snap.day_result||{};openScreen(`shop:${day}:${snap.money}:${JSON.stringify(snap.upgrades)}:${Math.ceil((snap.shop_ticks_left||0)/60)}`,`<div class="eyebrow">Ngày ${day} · Kết quả buổi tối</div><h2>Quán đã đóng cửa</h2><div class="list"><div>Đã phục vụ <strong>${result.served||0}</strong></div><div>Khách bỏ đi <strong>${result.left||0}</strong></div><div>Tiền thu <strong>${result.earned||0}k</strong></div><div>Tiền boa <strong>${result.tips||0}k</strong></div><div>Uy tín <strong>${result.reputation_change>0?"+":""}${result.reputation_change||0}</strong></div></div><h2>Chợ Chú Sáu</h2><p>Tiền hiện có <strong>${snap.money}k</strong> · Chợ đóng sau ${fmtTime(snap.shop_ticks_left||0)}</p><div class="list">${cards}</div><div class="actions"><button id="done">Kết thúc ngày</button></div>`);screen.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.getElementById("done").onclick=()=>action("shop_done");return;}
  if(phase!==lastPhase){if(lastPhase){interlude=phase==="quan"?"Bữa tối bắt đầu · Mang nguyên liệu về quán":`Ngày ${day} · Một chuyến lặn mới`;interludeUntil=performance.now()+4000;} lastPhase=phase;}
  if(performance.now()<interludeUntil){const stock=counts(snap.stock), available=availableStock(), possible=Object.entries(snap.menu||{}).filter(([id,d])=>Object.entries(d.recipe||{}).every(([k,v])=>(available[k]||0)>=v)).map(([id])=>DISH_NAME[id]||id);openScreen(`interlude:${phase}:${day}`,`<div class="eyebrow">Má Tư nhắn</div><h2>${html(interlude)}</h2>${phase==="quan"?`<p>Đã nhập ${Object.values(stock).reduce((a,b)=>a+b,0)} nguyên liệu. Có thể nấu: ${html(possible.join(", ")||"chưa đủ nguyên liệu")}.</p>`:`<p>Món dự định nấu</p><div class="list">${listItems(snap.day_plan?.dishes,DISH_NAME)}</div><p>Cần lấy</p><div class="list">${listItems(snap.day_plan?.ingredients,KIND_NAME)}</div>`}<button id="continue">Tiếp tục</button>`);document.getElementById("continue").onclick=()=>{interludeUntil=0;closeScreen();};return;}
  closeScreen();
  const gather=phase==="gather"; const p=snap.player||{};
  document.getElementById("hud-left").innerHTML=`<strong>Ngày ${day} · ${gather?"Lặn & Hái":"Mở Quán"}</strong><br><span class="${snap.time_left_ticks<=1800?"warn":""}">⏱ ${fmtTime(snap.time_left_ticks||0)}</span> ${gather?`· ♥ ${p.hp??0}/${p.hp_max??0} · Sâu ${Number(p.pos?.[1]||0).toFixed(1)}m<br><span class="${p.oxygen_ticks<p.oxygen_max_ticks*.25?"warn":""}">Oxy ${Math.ceil((p.oxygen_ticks||0)/60)}s</span> · Giỏ ${snap.hold_count||0}/${snap.hold_capacity||0}`:`· ${snap.money||0}k · ★ ${Number(snap.reputation||0).toFixed(1)}<br>Đang cầm: ${html(snap.hand?.dish_id||snap.hand||"chưa có")}`}`;
  const tableInfo=(snap.tables||[]).map(t=>{const c=(snap.customers||[]).find(c=>c.table_id===t.id);return `${t.id}: ${c?`${html(DISH_NAME[c.dish_id]||c.dish_id)} · <span class="${c.patience_ticks_left<900?"warn":""}">${Math.ceil(c.patience_ticks_left/60)}s</span>`:"trống"}`}).join("<br>");
  const stoveInfo=(snap.stoves||[]).map(s=>`${s.id}: ${s.state==="cooking"?`đang nấu ${Math.ceil(s.cook_ticks_left/60)}s`:s.state==="ready"?"món chín":"rảnh"}`).join(" · ");
  const planned = Object.entries(snap.day_plan?.ingredients || {})
    .map(([kind, count]) => `${html(KIND_NAME[kind] || kind)} ${counts(snap.hold)[kind] || 0}/${count}`).join(" · ");
  const available = Object.entries(availableStock())
    .map(([kind, count]) => `${html(KIND_NAME[kind] || kind)} ×${count}`).join(" · ");
  document.getElementById("hud-right").innerHTML = gather
    ? `<strong>Má Tư cần</strong><div>${planned || "Tìm nguyên liệu cho quán"}</div><div>${freshnessDetail(snap.hold)}</div>`
    : `<strong>Kho khả dụng</strong><div>${available || "Chưa đủ nguyên liệu"}</div><div>${freshnessDetail(snap.stock)}</div><div>${stoveInfo}</div><div>${tableInfo}</div>`;
  let msg=gather?"WASD di chuyển · E hái/cập bến · Space bắt cá · Esc tạm dừng":"WASD di chuyển · E nấu/bưng · Esc tạm dừng";
  if(gather && p.pos){const dock=snap.meta?.dock_pos||[2,0];if(Math.hypot(p.pos[0]-dock[0],p.pos[1]-dock[1])<=3)msg="E · Cập bến, mang giỏ về quán";else {const n=(snap.nodes||[]).find(n=>n.ready&&Math.hypot(p.pos[0]-n.pos[0],p.pos[1]-n.pos[1])<=2);if(n)msg=`E · Hái ${KIND_NAME[n.kind]||n.kind}`;}}
  if(gather && p.catch_cd_ticks>0)msg+=` · Bắt cá hồi ${Math.ceil(p.catch_cd_ticks/60)}s`;
  const warnings = [];
  if (gather && p.oxygen_max_ticks && p.oxygen_ticks < p.oxygen_max_ticks * .25) {
    warnings.push(p.oxygen_ticks === 0 ? "Hết hơi! Lên mặt nước ngay" : "Oxy sắp hết! Lên mặt nước");
  }
  if (gather && p.pos && (snap.monsters || []).some(m =>
    Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1])
      <= (snap.meta?.monsters?.species?.[m.kind]?.detect_radius ?? 10))) {
    warnings.push("Thủy quái gần! Tránh xa");
  }
  if (!gather && (snap.customers || []).some(c => c.state === "waiting"
      && c.patience_ticks_left < (snap.meta?.patience_s ?? 60) * 60 * .25)) {
    warnings.push("Khách sắp giận! Phục vụ ngay");
  }
  prompt.textContent = warnings.length ? warnings.join(" · ") : msg;
  prompt.classList.remove("hidden");
  prompt.classList.toggle("warn", warnings.length > 0);
}
if(localStorage.getItem("chonoi-contrast")==="1")document.body.classList.add("contrast");

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause:down.has("pause"),shop_done:down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "escape" || k === "p") { if(snap?.active){down.add("pause");e.preventDefault();} }
  else if (k === "h") { toggleContrast(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "escape" || k === "p") down.delete("pause");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    renderUI();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const ASSET = {
  gather: "/assets/backgrounds/bg_gather.svg",
  quan: "/assets/backgrounds/bg_quan.svg",
  utSenSide: "/assets/characters/ut_sen_side.svg",
  utSenTopdown: "/assets/characters/ut_sen_topdown.svg",
  customer: "/assets/characters/customer_topdown.svg",
  dock: "/assets/restaurant/dock.svg",
  fishLinh: "/assets/ingredients/school_ca_linh.svg",
  fishLoc: "/assets/ingredients/school_ca_loc.svg",
  fishKeo: "/assets/ingredients/school_ca_keo.svg",
  ingredientKeo: "/assets/ingredients/ca_keo.svg",
  ingredientNeo: "/assets/ingredients/keo_neo.svg",
  monster: "/assets/characters/ca_sau.svg",
  nodeDien: "/assets/nodes/node_bong_dien_dien.svg",
  nodeSung: "/assets/nodes/node_bong_sung.svg",
  nodeKeo: "/assets/nodes/node_keo_neo.svg",
  regrowing: "/assets/nodes/node_regrowing.svg",
  stoveIdle: "/assets/restaurant/stove_idle.svg",
  stoveCooking: "/assets/restaurant/stove_cooking.svg",
  stoveReady: "/assets/restaurant/stove_ready.svg",
  table: "/assets/restaurant/table_T1.svg",
  dishLoc: "/assets/dishes/ca_loc_nuong_trui.svg",
  dishSung: "/assets/dishes/goi_bong_sung.svg",
  dishLau: "/assets/dishes/lau_ca_linh_dien_dien.svg",
  dishCanh: "/assets/dishes/canh_chua_ca_loc.svg",
  dishKeo: "/assets/dishes/ca_keo_nuong.svg",
  dishMam: "/assets/dishes/lau_mam.svg",
  clock: "/assets/ui/icon_clock.svg",
  oxygen: "/assets/ui/icon_oxygen.svg",
  heart: "/assets/ui/icon_heart.svg",
  basket: "/assets/ui/icon_basket.svg",
  patience: "/assets/ui/icon_patience.svg",
  money: "/assets/ui/icon_money.svg",
  star: "/assets/ui/icon_star.svg",
  hand: "/assets/ui/icon_hand.svg",
  bubble: "/assets/fx/bubble.svg",
  catchRing: "/assets/fx/catch_ring.svg"
};
const images = {};
const DISH_ASSET={ca_loc_nuong_trui:"dishLoc",goi_bong_sung:"dishSung",lau_ca_linh_dien_dien:"dishLau",canh_chua_ca_loc:"dishCanh",ca_keo_nuong:"dishKeo",lau_mam:"dishMam"};
const INGREDIENT_ASSET={ca_keo:"ingredientKeo",keo_neo:"ingredientNeo"};
Object.entries(ASSET).forEach(([key, src]) => {
  const image = new Image();
  image.src = src;
  images[key] = image;
});
function drawAsset(key, x, y, width, height, angle = 0) {
  const image = images[key];
  if (!image || !image.complete || !image.naturalWidth) return false;
  ctx.save();
  ctx.translate(x, y);
  if (angle) ctx.rotate(angle);
  ctx.drawImage(image, -width / 2, -height / 2, width, height);
  ctx.restore();
  return true;
}
function drawCover(key, w, h) {
  const image = images[key];
  if (!image || !image.complete || !image.naturalWidth) return;
  const scale = Math.max(w / image.naturalWidth, h / image.naturalHeight);
  const dw = image.naturalWidth * scale, dh = image.naturalHeight * scale;
  ctx.drawImage(image, (w - dw) / 2, (h - dh) / 2, dw, dh);
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    const canOpenQuan = snap.mode === "gather" && ["docked", "time", "fainted"].includes(snap.reason);
    const nextAction = canOpenQuan ? "E mở quán · R chơi lại" : "Nhấn R để chơi lại";
    text(nextAction, w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const anim=performance.now()/1000;
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  drawCover("gather", w, h);
  for(let i=0;i<18;i++){const x=sx((i*37.7)%X), y=sy(((i*13.3-anim*(3+i%3))%D+D)%D);ctx.globalAlpha=.15+.15*Math.sin(anim*2+i)**2;drawAsset("bubble",x,y,8+i%3*4,8+i%3*4);}ctx.globalAlpha=1;
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  drawAsset("dock", sx(dp[0]), sy(-0.2), 6 * s, 2 * s);
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    drawAsset(ready ? (n.kind === "bong_sung" ? "nodeSung" : n.kind==="keo_neo"?"nodeKeo":"nodeDien") : "regrowing", sx(n.pos[0]), sy(n.pos[1]) - 0.5 * s + Math.sin(anim*2+n.pos[0]) * 2, 3.0 * s, 3.0 * s);
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    drawAsset(f.kind === "ca_loc" ? "fishLoc" : f.kind==="ca_keo"?"fishKeo":"fishLinh", sx(f.pos[0]), sy(f.pos[1])+Math.sin(anim*4+f.pos[0]) * 2, 5 * s, 3 * s, ((f.heading_deg || 0) * Math.PI) / 180);
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  (snap.monsters||[]).forEach(m=>{const mx=sx(m.pos[0]),my=sy(m.pos[1])+Math.sin(anim*3+m.pos[0])*2;ctx.shadowColor=m.state==="chase"?"#c884ff":"transparent";ctx.shadowBlur=m.state==="chase"?20:0;drawAsset("monster",mx,my,5*s,2.3*s);ctx.shadowBlur=0;if(m.state==="chase")text("!",mx,my-1.3*s,{align:"center",size:24,color:"#ffb4a0"});});
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      drawAsset("utSenSide", px, py+Math.sin(anim*5)*2, 3.2 * s, 3.2 * s);
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(30, (w - 260) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const item = snap.hold[i];
      if (item) {
        const kind = ingredientKind(item);
        ctx.fillStyle = kc(kind);
        ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        if (INGREDIENT_ASSET[kind]) drawAsset(INGREDIENT_ASSET[kind], x0+sz/2, y0+sz/2, sz-2, sz-2);
        if (isSpoiled(item)) text("!", x0 + sz/2, y0 + sz - 4, {align:"center", color:"#fff", size:18});
      }
    }
    const names = counts(snap.hold);
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  drawCover("quan", w, h);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const stoveKey = st.state === "cooking" ? "stoveCooking" : st.state === "ready" ? "stoveReady" : "stoveIdle";
    drawAsset(stoveKey, sx(st.pos[0]), sy(st.pos[1]), 2.8 * s, 2.8 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) {
      const dishKey = DISH_ASSET[st.dish?.dish_id||st.dish]||"dishLau";
      drawAsset(dishKey, sx(st.pos[0]), sy(st.pos[1]) - 1.0 * s, 1.5 * s, 1.5 * s);
    }
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    drawAsset("table", sx(tb.pos[0]), sy(tb.pos[1]), 2.8 * s, 2.8 * s);
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      drawAsset("customer", cx, cy, 1.8 * s, 1.8 * s);
      const dishKey = DISH_ASSET[c.dish_id]||null;
      if (dishKey) drawAsset(dishKey, cx, cy - 1.15 * s, 1.5 * s, 1.5 * s);
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    drawAsset("utSenTopdown", px, py, 1.8 * s, 1.8 * s);
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const dishKey = DISH_ASSET[hand]||"dishLau";
      drawAsset(dishKey, px, py - 1.1 * s, 1.4 * s, 1.4 * s);
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const stock = Object.entries(availableStock()).map(([k, n]) => (KIND_NAME[k] || k) + "×" + n).join(", ");
  text("Kho: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame(timestamp) {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "quan") drawQuan(w, h); else if(snap.phase==="gather") drawGather(w,h); else drawCover("quan",w,h);
    eventLog(w, h);
    overlay(w, h);
    if (snap.phase === "gather") window.__chonoiRendered?.(timestamp);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
